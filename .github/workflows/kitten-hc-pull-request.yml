name: KHC Build on PR

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v7
        - name: Set up JDK 25
          uses: actions/setup-java@v5
          with:
            java-version: '25'
            distribution: 'adopt'

        - name: Build and Test MAVEN for Reactive
          run:  make no-test

        - name: Build and Test Maven for Reports
          run:  make coverage
